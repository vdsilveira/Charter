# Sobe o loop x402 completo — vendedor, agente comprador e o app.
#
#   docker compose up --build        vendedor + app
#   docker compose run --rm agente   dispara uma compra e mostra o resultado
#
# Pré-requisitos que NÃO são automatizáveis (os dois saem de formulário web):
#   OZ_API_KEY          https://channels.openzeppelin.com/testnet/gen
#   USDC de testnet     https://faucet.circle.com/  + trustline nas duas contas
#
# Sem a chave o vendedor recusa a inicialização com a mensagem explicando o
# motivo — falhar na largada é melhor que aceitar pagamento que nunca liquida.

services:
  vendedor:
    build:
      context: .
      target: x402
    command: node src/x402-server.mjs
    ports: ["3001:3001"]
    env_file: [.env.demo]
    environment:
      STELLAR_NETWORK: ${STELLAR_NETWORK:-stellar:testnet}
      FACILITATOR_URL: ${FACILITATOR_URL:-https://channels.openzeppelin.com/x402/testnet}
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Comprador: roda sob demanda, não fica de pé. Um agente que compra dados em
  # loop infinito só queimaria USDC de testnet.
  agente:
    build:
      context: .
      target: x402
    command: node src/x402-agent.mjs
    env_file: [.env.demo]
    environment:
      STELLAR_NETWORK: ${STELLAR_NETWORK:-stellar:testnet}
      RESOURCE_URL: http://vendedor:3001/market-data
      # charter = paga pela smart account (a policy decide) | direct = conta
      # clássica. `direct` serve para isolar defeito: se ele funciona e
      # `charter` não, o problema está na nossa assinatura, não no x402.
      CHARTER_MODE: ${CHARTER_MODE:-charter}
    depends_on:
      vendedor:
        condition: service_healthy
    profiles: ["sob-demanda"]

  web:
    build:
      context: .
      target: web
    ports: ["3000:3000"]
    env_file: [.env.demo]
    environment:
      NODE_ENV: production
      PORT: 3000
